- name: WazirX WebSocket API
  description: >-
    The WazirX WebSocket API provides real-time streaming for market data including trades, 24hr tickers,
    candlestick (kline) data, and order book depth updates. Private streams for account balance changes,
    order updates, and own trade executions require authentication via an auth token.
